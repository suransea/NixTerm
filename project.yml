name: NixTerm
options:
  bundleIdPrefix: dev.nixterm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 0.4.0
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    revision: 4b6cfc6bba6ff045985eed528abe830be3301d30
targets:
  NixTerm:
    type: application
    platform: iOS
    sources:
      - Sources/NixTermApp
      - path: Resources/Guest
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - framework: .build/QEMU/Frameworks/qemu-aarch64-softmmu.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/pixman-1.0.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/jpeg.62.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/epoxy.0.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/gio-2.0.0.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/gobject-2.0.0.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/glib-2.0.0.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/gmodule-2.0.0.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/ffi.8.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/iconv.2.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/intl.8.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/zstd.1.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/slirp.0.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/spice-server.1.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/ssl.1.1.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/crypto.1.1.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/opus.0.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/gstreamer-1.0.0.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/gstapp-1.0.0.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/gstbase-1.0.0.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/virglrenderer.1.framework
        embed: true
        codeSign: true
        link: false
      - framework: .build/QEMU/Frameworks/vulkan.1.framework
        embed: true
        codeSign: true
        link: false
    settings:
      base:
        PRODUCT_NAME: NixTerm
        CLANG_ENABLE_OBJC_ARC: YES
        ALWAYS_SEARCH_USER_PATHS: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.nixterm.app
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/NixTermApp/NixTerm-Bridging-Header.h
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    scheme:
      testTargets: []
